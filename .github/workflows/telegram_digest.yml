name: Telegram Daily Digest

on:
  schedule:
    # 06:00 UTC = 08:00 Italian summer time / 07:00 winter time,
    # one hour after the 05:00 UTC calendar update.
    - cron: "0 6 * * *"
  workflow_dispatch:   # manual trigger from GitHub UI, useful for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPETITIONS: ${{ vars.TELEGRAM_COMPETITIONS }}
        run: python src/telegram_digest.py
